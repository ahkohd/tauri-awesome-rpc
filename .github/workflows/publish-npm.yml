name: Publish to npm

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
    types:
      - closed

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd guest-js
          npm install

      - name: Build
        run: |
          cd guest-js
          npm run build

      - name: Copy README
        run: |
          cp README.md guest-js/README.md

      - name: Check if version changed
        id: version-check
        run: |
          cd guest-js
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view tauri-awesome-rpc version 2>/dev/null || echo "0.0.0")

          if [ "$PACKAGE_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Version changed from $PUBLISHED_VERSION to $PACKAGE_VERSION"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged ($PACKAGE_VERSION)"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          cd guest-js
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
